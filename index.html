<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algorithm visualizer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Algorithm visualizer</h1>
</header>

<section id="picker">
  <div id="algo-cap" class="cap">Choose a problem</div>
  <div id="algo" class="tabs" role="group" aria-labelledby="algo-cap"></div>
</section>

<form id="controls">
  <span id="params"></span>
  <button id="new" type="button" class="primary">New run</button>
</form>

<main>
  <div class="left">
    <svg id="stage" role="img" aria-label="Visualization"></svg>
    <section id="data-box" class="collapsed">
      <div class="card-h"><h3 id="data-title"></h3><button id="data-tog" type="button" class="tog" data-name="data panel" aria-expanded="false" aria-label="Expand data panel">+</button></div>
      <div id="data-sum" class="sum" aria-live="polite"></div>
      <div id="data" class="adj"></div>
    </section>
  </div>
  <aside id="info" class="collapsed">
    <div class="card-h"><h2 id="head"></h2><button id="aside-tog" type="button" class="tog" data-name="step details" aria-expanded="false" aria-label="Expand step details">+</button></div>
    <div id="code-sum" class="sum"></div>
    <div id="text" aria-live="polite"></div>
    <section id="code-box">
      <h3>Pseudocode</h3>
      <ol id="code"></ol>
    </section>
  </aside>
</main>

<nav class="player">
  <button id="prev" type="button">Prev</button>
  <button id="next" type="button">Next</button>
  <input id="seek" type="range" min="0" value="0" aria-label="Step">
  <span id="count"></span>
</nav>

<footer id="disclaimer">Generated by AI.</footer>

<script src="core.js"></script>
<!-- To add an algorithm: create algos/<name>.js that calls VIZ.register(...), then list it here. -->
<script src="algos/vertex_cover.js"></script>
<script src="algos/insertion_sort.js"></script>
<script src="main.js"></script>
</body>
</html>
